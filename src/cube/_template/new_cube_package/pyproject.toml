[project]
name = "new-cube-package"
version = "0.1.0"
description = "A CUBE benchmark package"
requires-python = ">=3.12"
dependencies = [
    "cube-standard",
]

# If cube-standard is a local checkout, point uv at it:
# [tool.uv.sources]
# cube-standard = { path = "../cube-standard", editable = true }

[project.entry-points."cube.benchmarks"]
# The key is the benchmark name shown by `cube list`.
# Update "new-cube-package" to match your benchmark_metadata.name,
# and "CubeBenchmark" to your Benchmark subclass name.
new-cube-package = "cube_package.benchmark:CubeBenchmark"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.ruff]
fix = true
line-length = 120
indent-width = 4
