[project]
name = "counter-cube-remote"
version = "0.1.0"
description = "End-to-end example: counter-cube served remotely over JSON-RPC 2.0"
requires-python = ">=3.12"
dependencies = [
    "counter-cube",
    "httpx>=0.27",
]

[tool.uv.sources]
counter-cube = { path = "../counter-cube", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
