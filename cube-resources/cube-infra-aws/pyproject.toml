[project]
name = "cube-infra-aws"
version = "0.1.0"
description = "AWS InfraConfig for CUBE resource lifecycle"
authors = [
    { name = "Nicolas Gontier", email = "nicolas.gontier@servicenow.com" },
    { name = "Aman Jaiswal", email = "amanjaiswal73892@gmail.com" },
    { name = "Alexandre Lacoste", email = "alexandre.lacoste@servicenow.com" },
]
requires-python = ">=3.13"
dependencies = [
    "cube-standard",
    "boto3>=1.34",
    "botocore>=1.34",
    "requests>=2.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cube_infra_aws"]

[tool.uv.sources]
cube-standard = { path = "../..", editable = true }
