[project]
name = "cube-infra-modal"
version = "0.1.0"
description = "Modal InfraConfig for CUBE resource lifecycle — per-task Modal sandboxes"
authors = [
    { name = "Alexandre Lacoste", email = "alexandre.lacoste@servicenow.com" },
]
requires-python = ">=3.12"
dependencies = [
    "cube-standard",
    "modal>=1.3",
    "tenacity>=8.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cube_infra_modal"]

[tool.uv.sources]
cube-standard = { workspace = true }
