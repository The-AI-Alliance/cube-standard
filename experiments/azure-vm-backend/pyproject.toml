[project]
name = "cube-azure-experiment"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.15",
    "azure-mgmt-compute>=31.0",
    "azure-mgmt-network>=25.0",
    "azure-mgmt-storage>=21.0",
    "azure-storage-blob>=12.28.0",
    "huggingface-hub>=1.7.2",
    "requests>=2.28",
    "boto3>=1.34",
    "cube-infra-azure",
    "cube-computer-tool",
    "cube-vm-backend",
    "osworld-cube",
]

[tool.uv.sources]
cube-standard = { path = "../..", editable = true }
cube-infra-azure = { path = "../../cube-resources/cube-infra-azure", editable = true }
cube-computer-tool = { path = "../../cube-tools/cube-computer-tool", editable = true }
cube-vm-backend = { path = "../../cube-resources/cube-vm-backend", editable = true }
osworld-cube = { path = "../../../cube-harness/cubes/osworld-cube", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.optional-dependencies]
cube = [
    "cube-standard",
]
