[project]
name = "cube-standard"
version = "0.1.0"
description = "Common Unified Benchmark Environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.80.15",
    "pillow>=12.1.0",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
docker = [
    "docker>=7.1.0",
    "tenacity>=9.1.4",
]
daytona = [
    "daytona>=0.142.0",
    "python-dotenv>=1.2.1",
    "tenacity>=9.1.4",
]
modal = [
    "modal>=1.3.3",
    "tenacity>=9.1.4",
]
toolkit = [
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]
