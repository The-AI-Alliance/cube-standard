[project]
name = "cube-standard"
version = "0.1.0"
description = "Common Unified Benchmark Environments"
readme = "README.md"
authors = [
    { name = "Nicolas Gontier", email = "nicolas.gontier@servicenow.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "litellm>=1.0.0",
    "numpy>=1.24.0",
    "numpydoc>=1.8.0",
    "pillow>=9.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.8.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",  # For testing FastAPI
    "pre-commit>=3.6.0",
    "ruff>=0.8.0",
]

[tool.ruff]
fix = true
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
extend-select = ["I"] # sort imports
